name: Production Browser Smoke Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: mkdir -p artifacts
      - run: node tests/production-browser.mjs ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-${{ matrix.browser }}
          path: artifacts/
          if-no-files-found: ignore
